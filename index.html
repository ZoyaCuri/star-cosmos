<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curiositas</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0d0d;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
    <script src="https://telegram.org"></script>
</head>
<body>
    <canvas id="cosmos"></canvas>
    <script>
        const canvas = document.getElementById('cosmos');
        const ctx = canvas.getContext('2d');
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const stars = [];
        for(let i = 0; i < 150; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.5,
                alpha: Math.random()
            });
        }

        let pulse = 0;
        let starX = canvas.width / 2;
        let starY = canvas.height / 2;

        function drawFourPointedStar(cx, cy, spikes, outerRadius, innerRadius) {
            let rot = Math.PI / 2 * 3;
            let x = cx; let y = cy;
            let step = Math.PI / spikes;
            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;
                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            let gradient = ctx.createRadialGradient(cx, cy, innerRadius, cx, cy, outerRadius);
            gradient.addColorStop(0, '#ffffff');
            gradient.addColorStop(0.2, '#cccccc');
            gradient.addColorStop(1, 'rgba(100, 100, 100, 0)');
            ctx.fillStyle = gradient;
            ctx.fill();
        }

        function animate() {
            ctx.fillStyle = 'rgba(13, 13, 13, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                ctx.fillStyle = `rgba(180, 180, 180, ${s.alpha})`;
                ctx.fillRect(s.x, s.y, s.size, s.size);
                s.alpha += (Math.random() - 0.5) * 0.05;
                if(s.alpha < 0) s.alpha = 0;
                if(s.alpha > 1) s.alpha = 1;
            });
            starX += (Math.random() - 0.5) * 0.8;
            starY += (Math.random() - 0.5) * 0.8;
            if(starX < 50) starX = 50; if(starX > canvas.width - 50) starX = canvas.width - 50;
            if(starY < 50) starY = 50; if(starY > canvas.height - 50) starY = canvas.height - 50;
            pulse += 0.05;
            let currentOuter = 80 + Math.sin(pulse) * 15;
            let currentInner = 15 + Math.sin(pulse) * 3;
            ctx.shadowBlur = 30;
            ctx.shadowColor = 'rgba(200, 200, 200, 0.5)';
            drawFourPointedStar(starX, starY, 4, currentOuter, currentInner);
            ctx.shadowBlur = 0;
            requestAnimationFrame(animate);
        }
        animate();
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
    </script>
</body>
</html>
